name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Ctrl+Alt+Stand
        shell: powershell
        run: .\build.ps1

      - name: Run self-tests
        shell: powershell
        run: |
          .\dist\CtrlAltStand.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run startup smoke test
        shell: powershell
        run: |
          .\dist\CtrlAltStand.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: CtrlAltStand-windows
          path: dist/CtrlAltStand.exe
          if-no-files-found: error

  wpf:
    name: WPF build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Uses the same wpf\build.ps1 that produces the release binary, so CI
      # exercises the in-box .NET Framework MSBuild rather than the SDK or
      # Visual Studio. A missing 4.8 targeting pack surfaces as MSB3644 and
      # falls back to the GAC; that is expected and the build still succeeds.
      - name: Build Ctrl+Alt+Stand (WPF)
        shell: powershell
        run: .\wpf\build.ps1

      - name: Run self-tests
        shell: powershell
        run: |
          .\wpf\dist\CtrlAltStand.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run startup smoke test
        shell: powershell
        run: |
          .\wpf\dist\CtrlAltStand.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WPF executable
        uses: actions/upload-artifact@v7
        with:
          name: CtrlAltStand-wpf-windows
          path: wpf/dist/CtrlAltStand.exe
          if-no-files-found: error

  # Windows PowerShell 5.1 reads a UTF-8 file with no BOM as Windows-1252. An em dash (E2 80 94)
  # then decodes with its 0x94 byte as a right double quote, which silently terminates a PowerShell
  # string: the script parses into something other than what was written, runs partway, and can exit
  # 0 having done nothing. That is not hypothetical -- it made the first release run skip publishing
  # while reporting success. Keeping every .ps1 and workflow ASCII-only is the cheap durable defence.
  encoding:
    name: PowerShell and workflows are ASCII-only
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject non-ASCII characters
        shell: bash
        run: |
          files=$(git ls-files '*.ps1' '.github/workflows/*.yml')
          bad=$(echo "$files" | xargs grep -lP '[^\x00-\x7F]' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            for f in $bad; do
              echo "::error file=$f::Non-ASCII characters found. Use ASCII equivalents (-- for an em dash, plain quotes)."
              grep -nP '[^\x00-\x7F]' "$f" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "All tracked .ps1 files and workflows are ASCII-only."

  # Behavior changes are expected to arrive with their changelog entry, so the release notes are
  # never reconstructed from memory later. Deliberately scoped to app code (wpf/, src/): tooling,
  # CI, and docs-only changes are exempt, matching how the repository has been kept so far. Add the
  # `skip-changelog` label to override on a code change that genuinely needs no entry.
  changelog:
    name: Changelog entry for code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a changelog entry alongside app-code changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        shell: bash
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          code=$(echo "$changed" | grep -E '^(wpf|src)/.*\.(cs|xaml)$' || true)
          if [ -z "$code" ]; then
            echo "No app-code changes -- changelog entry not required."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "App code changed and CHANGELOG.md was updated."
            exit 0
          fi

          echo "::error::App code changed without a CHANGELOG.md entry. Add one under '## [Unreleased]', or apply the 'skip-changelog' label if this genuinely needs no entry."
          exit 1
